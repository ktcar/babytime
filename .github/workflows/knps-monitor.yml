name: KNPS campsite monitor

# 이 브랜치에 푸시하면 바로 감시를 시작한다 (조회 + 텔레그램 알림만, 자동 예약 없음).
# 작업 하나는 최대 6시간이라 5개를 차례로 이어 붙여 2026-10-10 11:00 KST까지 감시한다.
# 중지: Actions 탭 → 실행 중인 run → Cancel workflow
on:
  push:
    branches: [claude/knps-campsite-monitor-m9z709]
  workflow_dispatch:

concurrency:
  group: knps-monitor
  cancel-in-progress: true

env:
  KNPS_ID: ${{ secrets.KNPS_ID }}
  KNPS_PW: ${{ secrets.KNPS_PW }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  RUN_SECONDS: "20700" # 5시간 45분
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python3 knps_monitor.py --check
  part1:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python3 knps_monitor.py
        env:
          NOTIFY_START: "1"
  part2:
    needs: part1
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python3 knps_monitor.py
  part3:
    needs: part2
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python3 knps_monitor.py
  part4:
    needs: part3
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python3 knps_monitor.py
  part5:
    needs: part4
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python3 knps_monitor.py
